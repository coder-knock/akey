name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]        # releases are covered by release.yml
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Formatting first: it is the cheapest check and the one most likely to fail on a fresh
      # contribution, so it should not wait behind a full build.
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # lib tests run everywhere. The integration suites drive a POSIX shell
      # (`sh -c`, chmod, /dev/null) and are gated to unix; see TESTPLAN.md.
      - name: Unit tests
        run: cargo test --locked --lib

      - name: Integration and end-to-end tests
        if: runner.os != 'Windows'
        run: cargo test --locked --test contract --test e2e_sync

      # The installers are what most users actually run. install.sh's behaviour is tested for
      # real (with cargo and curl stubbed, so nothing is built or fetched); release.yml goes
      # further and runs both installers against a freshly built archive.
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh -n install.sh
          sh tests/installer.sh

      - name: install.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host 'install.ps1 parses'

  # `rust-version` in Cargo.toml is a promise to users, so it is built rather than asserted. The
  # floor comes from the dependency tree (`totp-rs`, and its `url` -> `idna` -> `icu_*` chain),
  # not from edition 2024 — the gap between 1.85 and 1.88 is exactly what this job catches.
  msrv:
    name: rust 1.88 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.88 --profile minimal
      - name: Build
        run: cargo +1.88 build --locked --all-targets

  # Advisories against the dependency tree. Not part of `test`: this is the one check whose failure
  # is usually not the author's fault, and it should be readable as its own signal.
  audit:
    name: advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
