# Blank issues are disabled so that a report lands in one of the two forms, and so that a security
# problem is routed to a private channel rather than the public tracker.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/coder-knock/akey/security/advisories/new
    about: Report privately. Do not open a public issue for a security problem.
  - name: Question or usage help
    url: https://github.com/coder-knock/akey/blob/main/docs/AGENT-INTEGRATION.md
    about: Integrating akey, exit codes, and what not to do — start here.
