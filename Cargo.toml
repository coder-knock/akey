[package]
name = "akey"
version = "0.1.0"
edition = "2024"
# Driven by the dependency tree, not by edition 2024 (which would need only 1.85):
# `totp-rs` requires 1.88, and its `url` -> `idna` -> `icu_*` chain requires 1.88 too.
# Declared so cargo refuses with a version requirement instead of a parse error.
rust-version = "1.88"
description = "Encrypted credential vault for AI agents, synced across devices over git"
license = "MIT"
repository = "https://github.com/coder-knock/akey"
readme = "README.md"
keywords = ["secrets", "credentials", "age", "cli", "ai-agents"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
fd-lock = "4.0.4"
rand = "0.10.2"
rpassword = "7.5.4"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.6"
totp-rs = { version = "6.0.0", default-features = false, features = ["otpauth"] }
ulid = { version = "3.0.0", features = ["serde"] }
zeroize = { version = "1.9.0", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
