[package]
name = "akey-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Desktop GUI for akey, built on GPUI"
license = "MIT"
publish = false

[features]
# `gpui` is **optional and off by default**. The pure logic (`backend`, `model`,
# `revealed`) carries every assertion the test plan names; the views are layout only.
# Keeping `gpui` opt-in means `cargo test -p akey-gui` runs on a machine without the
# Metal toolchain, and the root CLI's dependency graph never sees a GPU stack.
default = []
gpui = ["dep:gpui"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
zeroize = "1.9.0"

# Pinned to the version verified against its own examples. GPUI is pre-1.0 and its API
# moves; a `^0.2` range would silently pick up a breaking `0.2.x`.
#
# macOS uses the `macos-blade` renderer. GPUI's `build.rs` gates its Metal shader step on
# `#[cfg(not(feature = "macos-blade"))]`, so this choice is what lets the GUI build on a
# machine whose Xcode lacks the optional Metal Toolchain (`xcodebuild -showComponent
# MetalToolchain` → uninstalled). Without it, `xcrun metal` is a stub that errors out.
# `font-kit` is needed either way: text shaping is not part of the blade feature set.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", optional = true, default-features = false, features = [
    "macos-blade",
    "font-kit",
] }

# Everywhere else the default feature set supplies the wayland/x11 backends. Untested —
# the CLI's own end-to-end suite is Unix-gated and macOS is the primary platform.
[target.'cfg(not(target_os = "macos"))'.dependencies]
gpui = { version = "0.2.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
